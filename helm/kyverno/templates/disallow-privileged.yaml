apiVersion: kyverno.io/v1
kind: ClusterPolicy

metadata:
  name: disallow-privileged

spec:

  validationFailureAction: {{ .Values.validationFailureAction }}

  rules:

  - name: no-privileged

    match:
      any:
      - resources:
          kinds:
          - Pod

    validate:

      message: "Privileged containers are not allowed."

      pattern:

        spec:

          containers:

          - securityContext:

              privileged: false