apiVersion: kyverno.io/v1
kind: ClusterPolicy

metadata:
  name: require-team-label

spec:

  validationFailureAction: {{ .Values.validationFailureAction }}

  rules:

  - name: validate-team-label

    match:
      any:
      - resources:
          kinds:
          - Deployment

    validate:

      message: "Team label is mandatory."

      pattern:

        metadata:

          labels:

            team: "?*"